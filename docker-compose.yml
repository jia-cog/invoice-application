version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: invoice-backend
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=sqlite:///instance/invoice_app.db
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - db_data:/app/instance
    networks:
      - invoice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: invoice-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:5001/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - invoice-network

volumes:
  db_data:

networks:
  invoice-network:
    driver: bridge
