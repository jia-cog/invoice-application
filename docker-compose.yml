version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: invoice_app_db
    environment:
      POSTGRES_DB: invoice_app
      POSTGRES_USER: invoice_user
      POSTGRES_PASSWORD: invoice_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_user -d invoice_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
