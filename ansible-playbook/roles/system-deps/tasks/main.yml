---
# System Dependencies Role
# Installs Python3, Node.js, npm, Nginx, and other system-level packages.

- name: Install system packages
  ansible.builtin.apt:
    name: "{{ system_packages }}"
    state: present
  notify: Restart nginx

- name: Add NodeSource GPG key
  ansible.builtin.apt_key:
    url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    state: present

- name: Add NodeSource repository
  ansible.builtin.apt_repository:
    repo: "deb https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Verify Node.js installation
  ansible.builtin.command:
    cmd: node --version
  register: node_version
  changed_when: false

- name: Verify npm installation
  ansible.builtin.command:
    cmd: npm --version
  register: npm_version
  changed_when: false

- name: Display installed versions
  ansible.builtin.debug:
    msg: "Node.js {{ node_version.stdout }}, npm {{ npm_version.stdout }}"

- name: Create application user
  ansible.builtin.user:
    name: "{{ backend_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_base_dir }}"
    create_home: false

- name: Create application base directory
  ansible.builtin.file:
    path: "{{ app_base_dir }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_group }}"
    mode: "0755"
