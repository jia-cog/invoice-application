---
# System Dependencies Role - Install required system packages
# Installs Python3, Node.js, npm, Nginx, and other system-level dependencies

- name: Install base system packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
      - git
      - curl
      - sqlite3
      - libsqlite3-dev
    state: present
    update_cache: true

- name: Add NodeSource GPG key
  ansible.builtin.apt_key:
    url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    state: present

- name: Add NodeSource repository for Node.js {{ nodejs_version }}
  ansible.builtin.apt_repository:
    repo: "deb https://deb.nodesource.com/node_{{ nodejs_version }}.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js and npm
  ansible.builtin.apt:
    name:
      - nodejs
    state: present
    update_cache: true

- name: Verify Node.js installation
  ansible.builtin.command:
    cmd: node --version
  register: node_version
  changed_when: false

- name: Verify npm installation
  ansible.builtin.command:
    cmd: npm --version
  register: npm_version
  changed_when: false

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  notify: Start nginx

- name: Display installed versions
  ansible.builtin.debug:
    msg: |
      Node.js: {{ node_version.stdout }}
      npm: {{ npm_version.stdout }}
