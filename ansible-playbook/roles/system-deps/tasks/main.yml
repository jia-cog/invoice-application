---
# System Dependencies Role - Install system-level packages
# Installs Python3, Node.js, npm, Nginx, and other required packages

- name: Install base system packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
      - git
      - curl
      - wget
      - sqlite3
      - libsqlite3-dev
      - acl
    state: present
    update_cache: true

- name: Add NodeSource GPG key
  ansible.builtin.apt_key:
    url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    state: present

- name: Add NodeSource repository
  ansible.builtin.apt_repository:
    repo: "deb https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js and npm
  ansible.builtin.apt:
    name:
      - nodejs
    state: present
    update_cache: true

- name: Verify Node.js installation
  ansible.builtin.command: node --version
  register: node_version
  changed_when: false

- name: Verify npm installation
  ansible.builtin.command: npm --version
  register: npm_version
  changed_when: false

- name: Display Node.js and npm versions
  ansible.builtin.debug:
    msg: "Node.js {{ node_version.stdout }}, npm {{ npm_version.stdout }}"

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  notify: Start nginx

- name: Ensure Nginx is enabled
  ansible.builtin.systemd:
    name: nginx
    enabled: true
