---
# =============================================================================
# Invoice App Backend Role
# Clones the repository, sets up a Python virtual environment, installs
# dependencies, configures environment variables, and manages the Flask
# application as a systemd service (via gunicorn for production).
# =============================================================================

- name: Clone / update application repository
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ app_base_dir }}"
    version: "{{ app_repo_version }}"
    force: false
    update: true
  become: true
  become_user: "{{ app_user }}"
  notify: Restart invoice-backend

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv "{{ venv_dir }}"
    creates: "{{ venv_dir }}/bin/activate"
  become: true
  become_user: "{{ app_user }}"

- name: Upgrade pip inside virtualenv
  ansible.builtin.pip:
    name: pip
    state: present
    extra_args: --upgrade
    virtualenv: "{{ venv_dir }}"
  become: true
  become_user: "{{ app_user }}"

- name: Install Python dependencies from requirements.txt
  ansible.builtin.pip:
    requirements: "{{ app_base_dir }}/requirements.txt"
    virtualenv: "{{ venv_dir }}"
  become: true
  become_user: "{{ app_user }}"
  notify: Restart invoice-backend

- name: Install gunicorn (production WSGI server)
  ansible.builtin.pip:
    name: gunicorn
    state: present
    virtualenv: "{{ venv_dir }}"
  become: true
  become_user: "{{ app_user }}"

- name: Deploy backend environment file
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ backend_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"
  notify: Restart invoice-backend

- name: Deploy gunicorn configuration
  ansible.builtin.template:
    src: gunicorn.conf.py.j2
    dest: "{{ backend_dir }}/gunicorn.conf.py"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  notify: Restart invoice-backend

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: invoice-backend.service.j2
    dest: /etc/systemd/system/invoice-backend.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart invoice-backend

- name: Enable and start backend service
  ansible.builtin.systemd:
    name: invoice-backend
    state: started
    enabled: true
    daemon_reload: true
