---
# =============================================================================
# Invoice App Backend Role - Flask application setup and deployment
# =============================================================================

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_base_dir }}"
    create_home: false
  become: true

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_base_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  become: true

- name: Clone or update application repository
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ app_base_dir }}"
    version: "{{ app_repo_branch }}"
    force: false
  become: true
  become_user: "{{ app_user }}"
  notify: Restart invoice backend

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv {{ app_venv_dir }}
    creates: "{{ app_venv_dir }}/bin/activate"
  become: true
  become_user: "{{ app_user }}"

- name: Install Python dependencies from requirements.txt
  ansible.builtin.pip:
    requirements: "{{ app_base_dir }}/requirements.txt"
    virtualenv: "{{ app_venv_dir }}"
  become: true
  become_user: "{{ app_user }}"

- name: Install gunicorn for production WSGI server
  ansible.builtin.pip:
    name: gunicorn
    virtualenv: "{{ app_venv_dir }}"
  become: true
  become_user: "{{ app_user }}"

- name: Deploy backend environment file
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ app_backend_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  become: true
  notify: Restart invoice backend

- name: Deploy gunicorn configuration
  ansible.builtin.template:
    src: gunicorn.conf.py.j2
    dest: "{{ app_backend_dir }}/gunicorn.conf.py"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  become: true
  notify: Restart invoice backend

- name: Deploy WSGI entry point
  ansible.builtin.template:
    src: wsgi.py.j2
    dest: "{{ app_backend_dir }}/wsgi.py"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  become: true
  notify: Restart invoice backend

- name: Deploy systemd service file
  ansible.builtin.template:
    src: invoice-backend.service.j2
    dest: /etc/systemd/system/invoice-backend.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart invoice backend

- name: Enable and start invoice backend service
  ansible.builtin.systemd:
    name: invoice-backend
    enabled: true
    state: started
    daemon_reload: true
  become: true
