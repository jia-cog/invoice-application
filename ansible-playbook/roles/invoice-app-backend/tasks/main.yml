---
# Backend Role - Flask application deployment with Gunicorn
# Sets up virtual environment, installs dependencies, configures systemd service

- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ app_base_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"

- name: Clone or update application repository
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ app_base_dir }}"
    version: "{{ app_repo_branch }}"
    force: false
    update: true
  become: true
  become_user: "{{ app_user }}"
  notify: Restart invoice-backend

- name: Create Python virtual environment
  ansible.builtin.command: python3 -m venv {{ backend_venv_dir }}
  args:
    creates: "{{ backend_venv_dir }}/bin/activate"
  become: true
  become_user: "{{ app_user }}"

- name: Upgrade pip in virtual environment
  ansible.builtin.command: "{{ backend_venv_dir }}/bin/pip install --upgrade pip"
  become: true
  become_user: "{{ app_user }}"
  changed_when: false

- name: Install Python dependencies from requirements.txt
  ansible.builtin.pip:
    requirements: "{{ app_base_dir }}/requirements.txt"
    virtualenv: "{{ backend_venv_dir }}"
  become: true
  become_user: "{{ app_user }}"

- name: Install gunicorn for production serving
  ansible.builtin.pip:
    name: gunicorn
    virtualenv: "{{ backend_venv_dir }}"
  become: true
  become_user: "{{ app_user }}"

- name: Create log directory
  ansible.builtin.file:
    path: "/var/log/{{ app_name }}"
    state: directory
    mode: "0755"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"

- name: Deploy Gunicorn configuration file
  ansible.builtin.template:
    src: gunicorn.conf.py.j2
    dest: "{{ backend_dir }}/gunicorn.conf.py"
    mode: "0644"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  notify: Restart invoice-backend

- name: Deploy systemd service file
  ansible.builtin.template:
    src: invoice-backend.service.j2
    dest: /etc/systemd/system/invoice-backend.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart invoice-backend

- name: Ensure backend service is enabled and started
  ansible.builtin.systemd:
    name: invoice-backend
    state: started
    enabled: true
    daemon_reload: true
