---
# Database Role - SQLite database setup and initialization
# CRITICAL: The init_db.py script calls db.drop_all() which is destructive.
# Database initialization only runs on first-time provisioning.

- name: Ensure database directory exists
  ansible.builtin.file:
    path: "{{ database_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"

- name: Check if database file already exists
  ansible.builtin.stat:
    path: "{{ database_dir }}/invoice_app.db"
  register: database_file_stat

- name: Initialize database schema (first-time provisioning only)
  ansible.builtin.command:
    cmd: "{{ backend_venv_dir }}/bin/python3 -c \"
      import sys
      sys.path.insert(0, '{{ backend_dir }}')
      from app import create_app
      from models import db
      app = create_app()
      with app.app_context():
          db.create_all()
          print('Database schema created successfully')
      \""
  args:
    chdir: "{{ backend_dir }}"
  become: true
  become_user: "{{ app_user }}"
  environment:
    DATABASE_URL: "{{ database_url }}"
    JWT_SECRET_KEY: "{{ jwt_secret_key }}"
    SECRET_KEY: "{{ flask_secret_key }}"
  when: first_time_provision | bool or not database_file_stat.stat.exists
  register: database_init_result
  changed_when: database_init_result.rc == 0

- name: Display database initialization result
  ansible.builtin.debug:
    msg: "{{ database_init_result.stdout | default('Database already exists - skipping initialization') }}"

- name: Warn about destructive init_db.py script
  ansible.builtin.debug:
    msg: >
      WARNING: The init_db.py script in the repository calls db.drop_all() which
      destroys all data. This playbook uses db.create_all() instead, which safely
      creates tables only if they do not exist. Never run init_db.py directly in
      production unless you intend to wipe the database.
  when: first_time_provision | bool

- name: Set database file permissions
  ansible.builtin.file:
    path: "{{ database_dir }}/invoice_app.db"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"
  when: database_file_stat.stat.exists or (database_init_result is defined and database_init_result.rc == 0)

- name: Create database backup directory
  ansible.builtin.file:
    path: "{{ app_base_dir }}/backups"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"

- name: Set up daily database backup cron job
  ansible.builtin.cron:
    name: "Invoice app database backup"
    user: "{{ app_user }}"
    minute: "0"
    hour: "2"
    job: >
      cp {{ database_dir }}/invoice_app.db
      {{ app_base_dir }}/backups/invoice_app_$(date +\%Y\%m\%d_\%H\%M\%S).db
      && find {{ app_base_dir }}/backups -name 'invoice_app_*.db' -mtime +7 -delete
