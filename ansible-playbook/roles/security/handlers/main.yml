---
- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: Restart invoice-backend
  ansible.builtin.systemd:
    name: invoice-backend
    state: restarted
  failed_when: false

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
