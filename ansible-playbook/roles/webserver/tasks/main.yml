---
# Webserver Role (Nginx)
# Configures Nginx to:
#   - Serve React static files from the build directory
#   - Proxy /api requests to the Flask backend
#   - Handle SPA routing (fallback to index.html)
#   - Optionally terminate SSL

- name: Create log directory for invoice app
  ansible.builtin.file:
    path: /var/log/invoice-app
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy Nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy invoice app Nginx site configuration
  ansible.builtin.template:
    src: invoice-app.conf.j2
    dest: /etc/nginx/sites-available/invoice-app.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable invoice app Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/invoice-app.conf
    dest: /etc/nginx/sites-enabled/invoice-app.conf
    state: link
  notify: Reload nginx

- name: Test Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  register: nginx_test
  changed_when: false

- name: Ensure Nginx is running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
