---
# Webserver Role
# Configures Nginx to serve React frontend and proxy API requests to Flask backend

- name: Create log directory for invoice application
  ansible.builtin.file:
    path: /var/log/invoice-app
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy Nginx configuration for invoice application
  ansible.builtin.template:
    src: invoice-app.nginx.conf.j2
    dest: /etc/nginx/sites-available/invoice-app.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/invoice-app.conf
    dest: /etc/nginx/sites-enabled/invoice-app.conf
    state: link
  notify: Reload nginx

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  register: nginx_test
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: yes
    state: started
