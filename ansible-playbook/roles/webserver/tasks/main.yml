---
# Webserver Role - Nginx configuration
# Serves React static files and proxies API requests to Flask backend

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy Nginx configuration for invoice app
  ansible.builtin.template:
    src: invoice-app.nginx.conf.j2
    dest: /etc/nginx/sites-available/invoice-app.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable Nginx site configuration
  ansible.builtin.file:
    src: /etc/nginx/sites-available/invoice-app.conf
    dest: /etc/nginx/sites-enabled/invoice-app.conf
    state: link
  notify: Reload nginx

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  register: nginx_test
  changed_when: false

- name: Display Nginx validation result
  ansible.builtin.debug:
    msg: "Nginx config test: {{ nginx_test.stderr }}"

- name: Ensure Nginx is running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
