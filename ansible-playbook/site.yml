---
# Invoice Application Deployment Playbook
# Deploys a full-stack invoicing application (Flask + React + Nginx)
#
# Usage:
#   ansible-playbook -i inventory.ini site.yml
#
# Tags:
#   system   - System dependencies only
#   backend  - Backend deployment only
#   frontend - Frontend deployment only
#   database - Database setup only
#   webserver - Nginx configuration only
#   security - Security hardening only

- name: Deploy Invoice Application
  hosts: production
  become: true
  vars_files:
    - group_vars/production.yml

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: always

  roles:
    - role: system-deps
      tags: [system]

    - role: security
      tags: [security]

    - role: database
      tags: [database]

    - role: invoice-app-backend
      tags: [backend]

    - role: invoice-app-frontend
      tags: [frontend]

    - role: webserver
      tags: [webserver]

  post_tasks:
    - name: Verify backend health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ backend_port }}/api/health"
        method: GET
        return_content: yes
        status_code: 200
      register: health_check
      retries: 5
      delay: 3
      until: health_check.status == 200
      tags: always

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          ====================================
          Invoice Application Deployed!
          ====================================
          Backend:  http://{{ frontend_domain }}:{{ backend_port }}/api/health
          Frontend: https://{{ frontend_domain }}
          Health:   {{ health_check.json.status | default('unknown') }}
          ====================================
      tags: always
