---
# Invoice Application Deployment Playbook
# Deploys the full-stack invoice application (Flask backend + React frontend)
#
# Usage:
#   ansible-playbook -i inventories/production.ini site.yml
#
# Tags:
#   system   - System dependencies only
#   backend  - Backend deployment only
#   frontend - Frontend deployment only
#   database - Database setup only
#   webserver - Nginx configuration only
#   security - Security hardening only

- name: Deploy Invoice Application
  hosts: invoice_servers
  become: true
  vars_files:
    - group_vars/production.yml

  pre_tasks:
    - name: Assert production secrets are configured
      ansible.builtin.assert:
        that:
          - jwt_secret_key != 'CHANGE-ME-USE-ANSIBLE-VAULT'
          - flask_secret_key != 'CHANGE-ME-USE-ANSIBLE-VAULT'
        fail_msg: >
          Production secrets are not configured. Please set vault_jwt_secret_key
          and vault_flask_secret_key using Ansible Vault before deploying.
          See README.md for instructions.
      tags: always

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: always

    - name: Ensure deploy user exists
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_base_dir }}"
        create_home: true
      tags: always

  roles:
    - role: system-deps
      tags: system

    - role: security
      tags: security

    - role: invoice-app-backend
      tags: backend

    - role: database
      tags: database

    - role: invoice-app-frontend
      tags: frontend

    - role: webserver
      tags: webserver

  post_tasks:
    - name: Verify backend health check
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ backend_port }}/api/health"
        method: GET
        return_content: true
        status_code: 200
      register: health_check
      retries: 5
      delay: 3
      until: health_check.status == 200
      tags: always

    - name: Display health check result
      ansible.builtin.debug:
        msg: "Backend health check: {{ health_check.json.status }}"
      tags: always
