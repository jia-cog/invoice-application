# Invoice Application - Production Inventory
# ============================================
# Update the host entries below with your actual server details.
#
# Usage:
#   ansible-playbook -i inventory/production.ini site.yml
#
# For first-time provisioning:
#   ansible-playbook -i inventory/production.ini site.yml -e "first_time_provision=true"

[invoice_servers]
# Replace with your production server IP or hostname
# invoice-prod ansible_host=192.168.1.100 ansible_user=deploy

[invoice_servers:vars]
ansible_python_interpreter=/usr/bin/python3
