---
# =============================================================================
# Invoice Application - Production Configuration
# =============================================================================

# Application settings
app_name: invoice-app
app_user: invoice
app_group: invoice
app_base_dir: /opt/invoice-app
app_repo_url: https://github.com/jia-cog/invoice-application.git
app_repo_branch: master

# Backend settings
backend_port: 5001
backend_dir: "{{ app_base_dir }}/src/backend"
backend_venv_dir: "{{ app_base_dir }}/.venv"
backend_workers: 4

# Frontend settings
frontend_dir: "{{ app_base_dir }}/src/frontend"
frontend_build_dir: "{{ frontend_dir }}/build"

# Database settings
database_url: "sqlite:///{{ backend_dir }}/instance/invoice_app.db"
database_dir: "{{ backend_dir }}/instance"
database_file: "{{ backend_dir }}/instance/invoice_app.db"

# Security - Secrets (override these with Ansible Vault in production)
# Generate secure keys with: python3 -c "import secrets; print(secrets.token_hex(32))"
jwt_secret_key: "{{ vault_jwt_secret_key | default('CHANGE-ME-USE-ANSIBLE-VAULT') }}"
flask_secret_key: "{{ vault_flask_secret_key | default('CHANGE-ME-USE-ANSIBLE-VAULT') }}"

# Domain and URL configuration
server_domain: "{{ inventory_hostname }}"
frontend_url: "https://{{ server_domain }}"
api_base_url: "https://{{ server_domain }}/api"

# CORS configuration - restrict to production frontend domain only
cors_allowed_origins:
  - "https://{{ server_domain }}"

# Nginx settings
nginx_ssl_enabled: true
ssl_certificate_path: /etc/ssl/certs/invoice-app.crt
ssl_private_key_path: /etc/ssl/private/invoice-app.key

# Firewall settings
firewall_allowed_ports:
  - "22/tcp"    # SSH
  - "80/tcp"    # HTTP (redirect to HTTPS)
  - "443/tcp"   # HTTPS

# Node.js version
nodejs_major_version: "18"

# Gunicorn settings for production
gunicorn_bind: "127.0.0.1:{{ backend_port }}"
gunicorn_workers: "{{ backend_workers }}"
gunicorn_timeout: 120
gunicorn_log_level: info
gunicorn_access_log: "/var/log/{{ app_name }}/gunicorn-access.log"
gunicorn_error_log: "/var/log/{{ app_name }}/gunicorn-error.log"
